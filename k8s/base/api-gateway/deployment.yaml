apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: api
    # Placeholder — every real deploy PR overwrites this via `kustomize edit set label`
    # (patheya-express-platform's .github/actions/gitops-image-update, extended in Phase 9),
    # alongside the image tag bump in the same PR. Kyverno's require-labels baseline policy
    # (patheya-express-terraform's policy-guide.md) checks for this label's presence, not a
    # specific value, so the placeholder itself never fails admission — only a genuinely missing
    # label would.
    app.kubernetes.io/version: "unset"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "unset"
      annotations:
        # Same "placeholder, overwritten per-deploy-PR" contract as the version label above —
        # Kyverno's require-annotations policy checks these two keys are present on every Pod in
        # patheya-backend/patheya-frontend.
        patheya-express.io/git-commit: "unset"
        patheya-express.io/build-id: "unset"
    spec:
      serviceAccountName: api-gateway
      priorityClassName: patheya-express-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: patheya-express-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_NAME
              value: api-gateway
          envFrom:
            - configMapRef:
                name: api-gateway-config
            # Three ExternalSecret-produced Secrets (patheya-express-terraform's
            # modules/eks-addons/external-secrets.tf) — replaces the local secretGenerator
            # placeholder Phase 1A through Phase 8 relied on for `kubectl kustomize` to render at
            # all without a live cluster. Order doesn't matter for correctness (no overlapping
            # keys across the three), but matches the order those Secrets were introduced in.
            - secretRef:
                name: backend-database-url
            - secretRef:
                name: backend-redis-credentials
            - secretRef:
                name: backend-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Covers slow cold starts (Prisma engine init, first Redis connect) without letting a
          # merely-slow-starting pod get killed by the (much stricter) liveness probe.
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: true above means these three are the only writable paths — they
        # match exactly what the Dockerfile pre-creates (logs/, uploads/) plus Node's own /tmp use.
        - name: logs
          emptyDir: {}
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
