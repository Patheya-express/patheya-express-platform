apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No environment suffix — see base/kustomization.yaml's comment.
namespace: patheya-backend

resources:
  - ../../base

patches:
  - path: hpa-patch.yaml
  - path: ingress-patch.yaml

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      # See overlays/development/kustomization.yaml's comment on domain naming.
      - CUSTOMER_APP_URL=https://staging.customer.patheyaexpress.com
      - RESTAURANT_APP_URL=https://staging.restaurant.patheyaexpress.com
      - ADMIN_APP_URL=https://staging.admin.patheyaexpress.com
      - DELIVERY_APP_URL=https://staging.delivery.patheyaexpress.com

images:
  - name: patheya-express-api-gateway
    newTag: staging
