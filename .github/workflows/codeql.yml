name: codeql

# Section 11 (GitHub Security): CodeQL workflow — semantic static analysis, distinct from the
# Trivy SARIF uploads elsewhere in this repo's workflows (Trivy scans dependencies/images for known
# CVEs; CodeQL analyzes this repo's own TypeScript source for actual vulnerability *patterns*, e.g.
# injection, unsafe regex, prototype pollution).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly — catches a newly-added CodeQL query finding something in code that hasn't changed

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
