name: Reusable / Terraform validate + plan

# platform-standards.md Section 9/10: fmt -check and validate are required CI checks on every PR;
# this workflow adds tflint/tfsec/Checkov on top (this task's Section 4) and, for a real
# environment directory (not a bare module), a plan — never an apply. No job in this workflow ever
# runs `terraform apply`.
#
# The plan is never saved or uploaded. A binary plan file embeds the prior state, and for layers that
# manage credentials (database passwords, the Redis AUTH token, DATABASE_URL secrets) that state holds
# them in plain text — an artifact would copy those secrets out of AWS to anyone with read access to
# the repository's Actions. Full plan output stays in the runner's temp directory and is deleted;
# only the summary line and the resource addresses/actions are published to the job summary.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      needs-plan:
        description: >
          true for an environments/<tier>/<stage> directory with a real S3/DynamoDB backend and AWS
          credentials to plan against; false for a bare modules/<name> directory, which is
          validated with `init -backend=false` and no plan.
        type: boolean
        default: false
      aws-region:
        type: string
        default: ""
      role-to-assume:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Validate (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Terraform version
        id: tf-version
        run: |
          repo_root=$(git rev-parse --show-toplevel)
          if [ ! -f "$repo_root/.terraform-version" ]; then
            echo "No .terraform-version found at repo root ($repo_root)" >&2
            exit 1
          fi
          echo "version=$(cat "$repo_root/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: ${{ inputs.working-directory }}
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        if: inputs.needs-plan
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: terraform init (backend)
        if: inputs.needs-plan
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -input=false

      - name: terraform init (no backend, module validation only)
        if: ${{ !inputs.needs-plan }}
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint
        working-directory: ${{ inputs.working-directory }}
        run: |
          tflint --init
          tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ inputs.working-directory }}
          soft_fail: false
          # Authenticated release lookup — unauthenticated GitHub API calls from shared runners hit the
          # rate limit and the action's installer aborts before tfsec runs.
          github_token: ${{ github.token }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.working-directory }}
          framework: terraform
          quiet: true
          soft_fail: false

      - name: terraform plan (no plan file, summary only)
        if: inputs.needs-plan
        working-directory: ${{ inputs.working-directory }}
        run: |
          out="$RUNNER_TEMP/plan-output.txt"
          trap 'rm -f "$out"' EXIT
          set +e
          terraform plan -input=false -no-color -detailed-exitcode > "$out" 2>&1
          rc=$?
          set -e
          {
            echo "### terraform plan: ${{ inputs.working-directory }}"
            echo
            echo '```'
            grep -E '^(Plan:|No changes.|Error: )' "$out" || true
            grep -E '^  # .* (will|must) be ' "$out" | sed -E 's/^  # //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Plan:|No changes.)' "$out" || true
          if [ "$rc" -eq 1 ]; then
            # Error lines only; never the full plan body.
            grep -E '^(Error: |  on |│ Error)' "$out" | head -20 >&2 || true
            exit 1
          fi
          exit 0
