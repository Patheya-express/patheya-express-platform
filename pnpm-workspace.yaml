packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  less: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@angular/cdk@22.0.1'
  - '@angular/material@22.0.1'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
